    <text x="51" y="172" fill="#f1f5f2" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700">Código, dados e território.</text>
    <text x="54" y="220" fill="#c4d7d5" font-family="DejaVu Sans, sans-serif" font-size="21">Software · Análise de dados · Geoprocessamento</text>
